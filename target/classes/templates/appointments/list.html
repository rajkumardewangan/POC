<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container py-3">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div>
                <h1 class="mb-1">Appointments</h1>
                <p class="text-muted mb-0">Manage salon bookings and schedule updates.</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/appointments/calendar(date=${selectedDate})}" class="btn btn-outline-secondary">View Calendar</a>
                <a th:href="@{/appointments/new}" class="btn btn-primary">Book Appointment</a>
            </div>
        </div>

        <form th:action="@{/appointments}" method="get" class="card border-0 shadow-sm mb-3">
            <div class="card-body row g-3 align-items-end">
                <div class="col-md-5">
                    <label class="form-label">Barber</label>
                    <select name="barberId" class="form-select">
                        <option value="">All barbers</option>
                        <option th:each="barber : ${barbers}"
                                th:value="${barber.id}"
                                th:text="${barber.name}"
                                th:selected="${barber.id == selectedBarberId}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Customer</label>
                    <input type="text" name="customerName" class="form-control" placeholder="Search customer" th:value="${customerNameFilter}">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="">All statuses</option>
                        <option th:each="statusOpt : ${T(com.example.salon.entity.AppointmentStatus).values()}"
                                th:value="${statusOpt}"
                                th:text="${statusOpt}"
                                th:selected="${statusOpt.toString() == selectedStatus?.toString()}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" class="form-control" th:value="${selectedDate}">
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button type="submit" class="btn btn-primary w-100">Filter</button>
                    <a th:href="@{/appointments}" class="btn btn-outline-secondary w-100">Clear</a>
                </div>
            </div>
        </form>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th>Date &amp; Time</th>
                            <th>Customer</th>
                            <th>Barber</th>
                            <th>Service</th>
                            <th>Status</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="appt : ${appointments}">
                            <td th:text="${appt.id}"></td>
                            <td th:text="${#temporals.format(appt.appointmentDateTime, 'dd-MMM-yyyy HH:mm')}"></td>
                            <td th:text="${appt.customer.name}"></td>
                            <td th:text="${appt.barber.name}"></td>
                            <td th:text="${appt.serviceSummary}"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${appt.status.name() == 'SCHEDULED' ? 'bg-primary' : (appt.status.name() == 'IN_PROGRESS' ? 'bg-warning text-dark' : (appt.status.name() == 'COMPLETED' ? 'bg-success' : 'bg-secondary'))}"
                                      th:text="${appt.status}"></span>
                            </td>
                            <td class="text-end">
                                <a th:href="@{/appointments/{id}/edit(id=${appt.id})}" class="btn btn-sm btn-warning me-2">Edit</a>
                                <form th:if="${appt.status.name() != 'COMPLETED'}" th:action="@{/appointments/{id}/status(id=${appt.id})}" method="post" class="d-inline">
                                    <input type="hidden" name="status" value="COMPLETED">
                                    <button type="submit" class="btn btn-sm btn-success me-2">Complete</button>
                                </form>
                                <form th:action="@{/appointments/{id}/delete(id=${appt.id})}" method="post" class="d-inline"
                                      onsubmit="return confirm('Cancel this appointment?');">
                                    <button type="submit" class="btn btn-sm btn-danger">Cancel</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(appointments)}">
                            <td colspan="7" class="text-center text-muted py-4">No appointments yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
