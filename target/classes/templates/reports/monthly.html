<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Monthly Revenue Report</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container py-3">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <div>
                <h1 class="mb-1">Monthly Revenue Report</h1>
                <p class="text-muted mb-0">Revenue and appointment totals by month.</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/reports/weekly}" class="btn btn-outline-secondary">Weekly View</a>
                <a th:href="@{/}" class="btn btn-primary">Dashboard</a>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-muted text-uppercase">Total Revenue</h6>
                        <p class="display-6 mb-0" th:text="${'₹' + #numbers.formatDecimal(totalRevenue, 1, 2)}">₹0.00</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-muted text-uppercase">Current Month</h6>
                        <p class="fs-5 mb-0" th:text="${#temporals.format(currentMonth, 'MMM yyyy')}">Month</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Month Start</th>
                            <th>Month End</th>
                            <th>Appointments</th>
                            <th>Revenue</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="row : ${monthlyReports}">
                            <td th:text="${#temporals.format(row.monthStart, 'MMM yyyy')}">Month</td>
                            <td th:text="${#temporals.format(row.monthEnd, 'MMM yyyy')}">Month</td>
                            <td th:text="${row.appointments}">0</td>
                            <td th:text="${'₹' + #numbers.formatDecimal(row.revenue, 1, 2)}">₹0.00</td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(monthlyReports)}">
                            <td colspan="4" class="text-center text-muted py-4">No completed appointment data for this month.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
