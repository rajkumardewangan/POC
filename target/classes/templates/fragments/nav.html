<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="nav" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">Men's Salon</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item" th:if="${currentUser == null or currentUser.role.name() == 'ADMIN'}">
                        <a class="nav-link" th:href="@{/}">Dashboard</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null and currentUser.role.name() == 'REGULAR'}">
                        <a class="nav-link" th:href="@{/appointments/calendar}">My Calendar</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser == null or currentUser.role.name() == 'ADMIN' or currentUser.role.name() == 'REGULAR'}">
                        <a class="nav-link" th:href="@{/appointments}">Appointments</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser == null or currentUser.role.name() == 'ADMIN'}">
                        <a class="nav-link" th:href="@{/customers}">Customers</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser == null or currentUser.role.name() == 'ADMIN'}">
                        <a class="nav-link" th:href="@{/customers/retention}">Retention</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser == null or currentUser.role.name() == 'ADMIN'}">
                        <a class="nav-link" th:href="@{/barbers}">Barbers</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser == null or currentUser.role.name() == 'ADMIN'}">
                        <a class="nav-link" th:href="@{/services}">Services</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser == null or currentUser.role.name() == 'ADMIN'}">
                        <a class="nav-link" th:href="@{/attendances}">Attendance</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser == null or currentUser.role.name() == 'ADMIN'}">
                        <a class="nav-link" th:href="@{/reports}">Reports</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}">
                        <a class="nav-link" th:href="@{/users/manage}">Manage Users</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser == null or currentUser.role.name() == 'ADMIN'}">
                        <a class="nav-link" th:href="@{/h2-console}" target="_blank">H2 Console</a>
                    </li>
                    <li class="nav-item ms-lg-3" th:if="${currentUser != null and currentUser.role.name() == 'ADMIN'}">
                        <form th:action="@{/customers}" method="get" class="d-flex gap-2">
                            <input type="text" name="search" class="form-control form-control-sm" placeholder="Customer lookup" aria-label="Customer lookup">
                            <button type="submit" class="btn btn-sm btn-light">Find</button>
                        </form>
                    </li>
                    <li class="nav-item ms-lg-3" th:if="${currentUser != null}">
                        <a class="btn btn-outline-light btn-sm" th:href="@{/users/logout}">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</body>
</html>
