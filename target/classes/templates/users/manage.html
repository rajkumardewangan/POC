<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Manage Staff Profiles</h2>
        <div class="d-flex gap-2">
            <a th:href="@{/}" class="btn btn-outline-dark btn-sm">Back to Dashboard</a>
            <a th:href="@{/users/manage/new}" class="btn btn-dark btn-sm">Create Profile</a>
        </div>
    </div>

    <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
        <div class="card-body">
            <h5 class="card-title">Existing Users</h5>
            <div class="table-responsive">
                <table class="table table-striped mb-0">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Phone</th>
                        <th>Role</th>
                        <th>Specialty</th>
                        <th>Monthly Gross</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.name}"></td>
                        <td th:text="${user.phone}"></td>
                        <td>
                            <span class="badge" th:classappend="${user.role.name() == 'ADMIN' ? 'bg-dark' : 'bg-secondary'}"
                                  th:text="${user.role}"></span>
                        </td>
                        <td th:text="${user.barber != null ? user.barber.specialty : '-'}">-</td>
                        <td th:text="${user.barber != null ? '₹' + #numbers.formatDecimal(user.barber.grossMonthlySalary, 1, 2) : '-'}">-</td>
                        <td class="text-end text-nowrap">
                            <a class="btn btn-sm btn-outline-secondary" th:href="@{/users/manage/{id}/edit(id=${user.id})}">Edit</a>
                            <form th:action="@{/users/manage/{id}/delete(id=${user.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Delete this profile?')">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
