server.port=8080

spring.application.name=mens-salon

# H2 Database (file-based so data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/salondb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Thymeleaf
spring.thymeleaf.cache=false

# Optional first-run administrator. Used only when the database has no admin profile.
salon.bootstrap-admin.name=${SALON_BOOTSTRAP_ADMIN_NAME:}
salon.bootstrap-admin.phone=${SALON_BOOTSTRAP_ADMIN_PHONE:}

# WhatsApp Cloud API. Configure these values through environment variables before enabling the webhook.
salon.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
salon.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
salon.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
salon.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
salon.whatsapp.owner-numbers=${WHATSAPP_OWNER_NUMBERS:}
salon.whatsapp.graph-api-version=${WHATSAPP_GRAPH_API_VERSION:v22.0}
