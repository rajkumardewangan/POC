<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customer Retention</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container py-3">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <div>
                <h1 class="mb-1">Customer Retention</h1>
                <p class="text-muted mb-0">Repeat-visit KPI summary for the salon.</p>
            </div>
            <a th:href="@{/customers}" class="btn btn-outline-secondary">Back to Customers</a>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-muted text-uppercase">Total Customers</h6>
                        <p class="display-6 mb-0" th:text="${totalCustomers}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-muted text-uppercase">Repeat Customers</h6>
                        <p class="display-6 mb-0" th:text="${repeatCustomers}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-muted text-uppercase">Retention Rate</h6>
                        <p class="display-6 mb-0" th:text="${#numbers.formatDecimal(retentionRate, 1, 1)} + '%'">0.0%</p>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <h6 class="text-muted text-uppercase">Avg Visits</h6>
                        <p class="display-6 mb-0" th:text="${#numbers.formatDecimal(averageVisits, 1, 1)}">0.0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Customer</th>
                            <th>Phone</th>
                            <th>Visits</th>
                            <th>Returning</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="summary : ${retentionSummaries}">
                            <td th:text="${summary.customer.name}">Customer</td>
                            <td th:text="${summary.customer.phone}">Phone</td>
                            <td>
                                <span class="badge bg-primary" th:text="${summary.visitCount}">0</span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="${summary.returningCustomer} ? 'bg-success' : 'bg-secondary'"
                                      th:text="${summary.returningCustomer ? 'Yes' : 'No'}">No</span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(retentionSummaries)}">
                            <td colspan="4" class="text-center text-muted py-4">No customer visit data available yet.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
