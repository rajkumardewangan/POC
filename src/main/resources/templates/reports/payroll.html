<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payroll Report</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h1 class="mb-1">Payroll Report</h1>
                <p class="text-muted mb-0">Attendance-based monthly salary for each barber.</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/reports}" class="btn btn-outline-secondary">Reports</a>
                <a th:href="@{/}" class="btn btn-primary">Dashboard</a>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div class="text-muted text-uppercase small">Month</div>
                        <div class="fs-4 fw-bold" th:text="${#temporals.format(month.atDay(1), 'MMM yyyy')}">Month</div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body">
                        <div class="text-muted text-uppercase small">Total Payroll</div>
                        <div class="fs-4 fw-bold" th:text="${'₹' + #numbers.formatDecimal(totalPayroll, 1, 2)}">₹0.00</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Barber</th>
                                <th>Base Salary</th>
                                <th>Allowances</th>
                                <th>Gross Salary</th>
                                <th>Fixed Deduction</th>
                                <th>Full Days</th>
                                <th>Half Days</th>
                                <th>Leave Days</th>
                                <th>Net Salary</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${payrollRows}">
                                <td th:text="${row.barber.name}">Barber</td>
                                <td th:text="${'₹' + #numbers.formatDecimal(row.baseSalary, 1, 2)}">₹0.00</td>
                                <td th:text="${'₹' + #numbers.formatDecimal(row.allowances, 1, 2)}">₹0.00</td>
                                <td th:text="${'₹' + #numbers.formatDecimal(row.grossSalary, 1, 2)}">₹0.00</td>
                                <td th:text="${'₹' + #numbers.formatDecimal(row.fixedDeduction, 1, 2)}">₹0.00</td>
                                <td th:text="${row.fullDays}">0</td>
                                <td th:text="${row.halfDays}">0</td>
                                <td th:text="${row.leaveDays}">0</td>
                                <td class="fw-semibold" th:text="${'₹' + #numbers.formatDecimal(row.netSalary, 1, 2)}">₹0.00</td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(payrollRows)}">
                                <td colspan="9" class="text-center text-muted py-4">No payroll data for this month.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
