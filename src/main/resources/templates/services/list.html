<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Services</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .service-table {
            table-layout: fixed;
            width: 100%;
        }
        .service-table th:nth-child(1),
        .service-table td:nth-child(1) {
            width: 36%;
        }
        .service-table th:nth-child(2),
        .service-table td:nth-child(2) {
            width: 16%;
        }
        .service-table th:nth-child(3),
        .service-table td:nth-child(3) {
            width: 16%;
        }
        .service-table th:nth-child(4),
        .service-table td:nth-child(4) {
            width: 32%;
        }
        .service-name {
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        .service-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.35rem;
        }
        .service-actions .btn,
        .service-actions form {
            margin: 0 !important;
        }

        @media (max-width: 767.98px) {
            .service-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .service-actions .btn,
            .service-actions form,
            .service-actions form button {
                width: 100%;
            }

            .service-table th:nth-child(1),
            .service-table td:nth-child(1) {
                width: 42%;
            }
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container py-3">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h1 class="mb-0">Services</h1>
            <a th:href="@{/services/new}" class="btn btn-primary">Add Service</a>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div th:if="${topService != null}" class="alert alert-info">
            Top service: <strong th:text="${topService.name}"></strong> with <strong th:text="${topService.revenue}"></strong> in revenue.
        </div>

        <div class="row g-4">
            <div class="col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">Men</h4>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0 service-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Price</th>
                                    <th>Duration</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="service : ${menServices}">
                                    <td class="service-name" th:text="${service.name}"></td>
                                    <td th:text="${'₹' + service.price}"></td>
                                    <td th:text="${service.durationMinutes + ' min'}"></td>
                                    <td>
                                        <div class="service-actions">
                                        <a th:href="@{/services/{id}(id=${service.id})}" class="btn btn-sm btn-info text-white me-1">History</a>
                                        <a th:href="@{/services/{id}/edit(id=${service.id})}" class="btn btn-sm btn-secondary me-1">Edit</a>
                                        <form th:action="@{/services/{id}/delete(id=${service.id})}" method="post" class="d-inline"
                                              onsubmit="return confirm('Delete this service?');">
                                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                        </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(menServices)}">
                                    <td colspan="4" class="text-center text-muted py-4">No Men services yet.</td>
                                </tr>
                            </tbody>
                        </table>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">Women</h4>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0 service-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Price</th>
                                    <th>Duration</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="service : ${womenServices}">
                                    <td class="service-name" th:text="${service.name}"></td>
                                    <td th:text="${'₹' + service.price}"></td>
                                    <td th:text="${service.durationMinutes + ' min'}"></td>
                                    <td>
                                        <div class="service-actions">
                                        <a th:href="@{/services/{id}(id=${service.id})}" class="btn btn-sm btn-info text-white me-1">History</a>
                                        <a th:href="@{/services/{id}/edit(id=${service.id})}" class="btn btn-sm btn-secondary me-1">Edit</a>
                                        <form th:action="@{/services/{id}/delete(id=${service.id})}" method="post" class="d-inline"
                                              onsubmit="return confirm('Delete this service?');">
                                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                                        </form>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(womenServices)}">
                                    <td colspan="4" class="text-center text-muted py-4">No Women services yet.</td>
                                </tr>
                            </tbody>
                        </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
