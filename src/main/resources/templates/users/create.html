<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Staff Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container py-3" style="max-width: 960px">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1">Create Profile</h1>
            <p class="text-muted mb-0">Set account access and staff details.</p>
        </div>
        <a th:href="@{/users/manage}" class="btn btn-outline-secondary">Back to Users</a>
    </div>
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/users/manage}" method="post" class="card card-body" id="create-profile-form">
        <div class="row g-3">
            <div class="col-12"><h2 class="h5 mb-0">Account Access</h2></div>
            <div class="col-md-6">
                <label for="name" class="form-label">Full Name</label>
                <input id="name" name="name" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label for="phone" class="form-label">Mobile Number</label>
                <input id="phone" name="phone" class="form-control" inputmode="tel" required>
            </div>
            <div class="col-md-6">
                <label for="role" class="form-label">Application Access</label>
                <select id="role" name="role" class="form-select role-select" required>
                    <option th:each="role : ${userRoles}" th:value="${role}" th:text="${role.name() == 'ADMIN' ? 'Admin: all areas' : 'Regular: calendar and appointments'}"></option>
                </select>
            </div>

            <section class="col-12 staff-fields" aria-labelledby="staff-heading">
                <hr>
                <h2 id="staff-heading" class="h5">Staff Details</h2>
                <div class="row g-3">
                    <div class="col-md-6"><label for="specialty" class="form-label">Specialty</label><input id="specialty" name="specialty" class="form-control" placeholder="Hair styling, beard care"></div>
                    <div class="col-md-6"><label for="email" class="form-label">Email</label><input id="email" name="email" type="email" class="form-control"></div>
                    <div class="col-12"><label for="address" class="form-label">Address</label><textarea id="address" name="address" class="form-control" rows="2"></textarea></div>
                    <div class="col-md-6"><label for="emergencyContactName" class="form-label">Emergency Contact Name</label><input id="emergencyContactName" name="emergencyContactName" class="form-control"></div>
                    <div class="col-md-6"><label for="emergencyContactPhone" class="form-label">Emergency Contact Mobile</label><input id="emergencyContactPhone" name="emergencyContactPhone" class="form-control" inputmode="tel"></div>
                    <div class="col-md-4"><label for="joiningDate" class="form-label">Joining Date</label><input id="joiningDate" name="joiningDate" type="date" class="form-control"></div>
                    <div class="col-md-4"><label for="employmentType" class="form-label">Employment Type</label><select id="employmentType" name="employmentType" class="form-select"><option value="">Select type</option><option value="Full-time">Full-time</option><option value="Part-time">Part-time</option><option value="Contract">Contract</option></select></div>
                    <div class="col-md-4"><label for="weeklyOffDay" class="form-label">Weekly Off</label><select id="weeklyOffDay" name="weeklyOffDay" class="form-select"><option th:each="day : ${T(java.time.DayOfWeek).values()}" th:value="${day}" th:text="${day}"></option></select></div>
                </div>
            </section>

            <section class="col-12 staff-fields" aria-labelledby="salary-heading">
                <hr>
                <h2 id="salary-heading" class="h5">Monthly Salary Structure</h2>
                <div class="row g-3">
                    <div class="col-md-4"><label for="baseSalary" class="form-label">Base Salary (₹)</label><input id="baseSalary" name="baseSalary" type="number" min="0" step="0.01" class="form-control" value="0"></div>
                    <div class="col-md-4"><label for="housingAllowance" class="form-label">Housing Allowance (₹)</label><input id="housingAllowance" name="housingAllowance" type="number" min="0" step="0.01" class="form-control" value="0"></div>
                    <div class="col-md-4"><label for="transportAllowance" class="form-label">Transport Allowance (₹)</label><input id="transportAllowance" name="transportAllowance" type="number" min="0" step="0.01" class="form-control" value="0"></div>
                    <div class="col-md-6"><label for="otherAllowance" class="form-label">Other Allowance (₹)</label><input id="otherAllowance" name="otherAllowance" type="number" min="0" step="0.01" class="form-control" value="0"></div>
                    <div class="col-md-6"><label for="fixedSalaryDeduction" class="form-label">Fixed Monthly Deduction (₹)</label><input id="fixedSalaryDeduction" name="fixedSalaryDeduction" type="number" min="0" step="0.01" class="form-control" value="0"></div>
                    <div class="col-12"><p class="small text-muted mb-0">Monthly gross pay is base salary plus allowances. Fixed deduction and attendance deductions are subtracted in payroll.</p></div>
                </div>
            </section>

            <div class="col-12 d-flex gap-2 pt-2">
                <button type="submit" class="btn btn-dark">Create Profile</button>
                <a th:href="@{/users/manage}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </div>
    </form>
</main>
<script>
    const roleSelect = document.querySelector('.role-select');
    const staffSections = document.querySelectorAll('.staff-fields');
    const staffInputs = document.querySelectorAll('.staff-fields input, .staff-fields select, .staff-fields textarea');
    const specialty = document.querySelector('[name="specialty"]');
    const updateStaffFields = () => {
        const isStaff = roleSelect.value === 'REGULAR';
        staffSections.forEach(section => section.hidden = !isStaff);
        staffInputs.forEach(input => input.disabled = !isStaff);
        specialty.required = isStaff;
    };
    roleSelect.addEventListener('change', updateStaffFields);
    updateStaffFields();
</script>
</body>
</html>
