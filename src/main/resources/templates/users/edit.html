<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<main class="container py-3" style="max-width: 720px">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 mb-0">Edit Profile</h1>
        <a th:href="@{/users/manage}" class="btn btn-outline-secondary">Back to Users</a>
    </div>
    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>
    <form th:action="@{/users/manage/{id}/edit(id=${user.id})}" method="post" class="card card-body" id="edit-profile-form">
        <div class="row g-3">
            <div class="col-md-6"><label for="name" class="form-label">Name</label><input id="name" name="name" class="form-control" th:value="${user.name}" required></div>
            <div class="col-md-6"><label for="phone" class="form-label">Mobile Number</label><input id="phone" name="phone" class="form-control" th:value="${user.phone}" required></div>
            <div class="col-12"><label for="role" class="form-label">Access Role</label>
                <select id="role" name="role" class="form-select role-select" required>
                    <option th:each="role : ${userRoles}" th:value="${role}" th:text="${role}" th:selected="${role.name() == user.role.name()}"></option>
                </select>
            </div>
            <div class="col-12 staff-fields">
                <hr>
                <h2 class="h5">Staff Details</h2>
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label">Specialty</label><input name="specialty" class="form-control" th:value="${staffProfile.specialty}" data-required="true"></div>
                    <div class="col-md-6"><label class="form-label">Email</label><input name="email" type="email" class="form-control" th:value="${staffProfile.email}"></div>
                    <div class="col-12"><label class="form-label">Address</label><textarea name="address" class="form-control" rows="2" th:text="${staffProfile.address}"></textarea></div>
                    <div class="col-md-6"><label class="form-label">Emergency Contact Name</label><input name="emergencyContactName" class="form-control" th:value="${staffProfile.emergencyContactName}"></div>
                    <div class="col-md-6"><label class="form-label">Emergency Contact Mobile</label><input name="emergencyContactPhone" class="form-control" th:value="${staffProfile.emergencyContactPhone}"></div>
                    <div class="col-md-4"><label class="form-label">Joining Date</label><input name="joiningDate" type="date" class="form-control" th:value="${staffProfile.joiningDate}"></div>
                    <div class="col-md-4"><label class="form-label">Employment Type</label><select name="employmentType" class="form-select"><option value="">Select type</option><option th:each="type : ${ {'Full-time', 'Part-time', 'Contract'} }" th:value="${type}" th:text="${type}" th:selected="${type == staffProfile.employmentType}"></option></select></div>
                    <div class="col-md-4"><label class="form-label">Weekly Off</label><select name="weeklyOffDay" class="form-select"><option th:each="day : ${T(java.time.DayOfWeek).values()}" th:value="${day}" th:text="${day}" th:selected="${day.name() == staffProfile.weeklyOffDay.name()}"></option></select></div>
                    <div class="col-md-4"><label class="form-label">Base Monthly Salary (₹)</label><input name="baseSalary" type="number" min="0" step="0.01" class="form-control" th:value="${staffProfile.baseSalary}"></div>
                    <div class="col-md-4"><label class="form-label">Housing Allowance (₹)</label><input name="housingAllowance" type="number" min="0" step="0.01" class="form-control" th:value="${staffProfile.housingAllowance}"></div>
                    <div class="col-md-4"><label class="form-label">Transport Allowance (₹)</label><input name="transportAllowance" type="number" min="0" step="0.01" class="form-control" th:value="${staffProfile.transportAllowance}"></div>
                    <div class="col-md-6"><label class="form-label">Other Monthly Allowance (₹)</label><input name="otherAllowance" type="number" min="0" step="0.01" class="form-control" th:value="${staffProfile.otherAllowance}"></div>
                    <div class="col-md-6"><label class="form-label">Fixed Monthly Deduction (₹)</label><input name="fixedSalaryDeduction" type="number" min="0" step="0.01" class="form-control" th:value="${staffProfile.fixedSalaryDeduction}"></div>
                </div>
                <p class="small text-muted mt-2 mb-0">Monthly gross pay is base salary plus allowances. Fixed deduction and attendance deductions are subtracted in payroll.</p>
            </div>
            <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-dark">Save Changes</button>
                <a th:href="@{/users/manage}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </div>
    </form>
</main>
<script>
    const roleSelect = document.querySelector('.role-select');
    const staffFields = document.querySelector('.staff-fields');
    const specialty = staffFields.querySelector('[name="specialty"]');
    const updateVisibility = () => {
        const isStaff = roleSelect.value === 'REGULAR';
        staffFields.hidden = !isStaff;
        specialty.required = isStaff;
        staffFields.querySelectorAll('input, select, textarea').forEach(input => input.disabled = !isStaff);
    };
    roleSelect.addEventListener('change', updateVisibility);
    updateVisibility();
</script>
</body>
</html>
