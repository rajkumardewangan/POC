<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointment Calendar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .calendar-table td, .calendar-table th {
            vertical-align: top;
        }
        .time-col {
            width: 90px;
            font-weight: 600;
            background-color: #f8f9fa;
            white-space: nowrap;
        }
        .appt-cell {
            background-color: #e7f1ff;
            border-radius: 4px;
            padding: 6px 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/nav :: nav}"></div>

    <div class="container-fluid">
        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
            <h1>Appointment Calendar</h1>
            <a th:href="@{/appointments/new}" class="btn btn-primary">Book Appointment</a>
        </div>

        <div class="d-flex align-items-center flex-wrap gap-2 mb-3">
            <a th:href="@{/appointments/calendar(date=${prevDate})}" class="btn btn-outline-secondary btn-sm">&laquo; Prev</a>
            <form th:action="@{/appointments/calendar}" method="get" class="d-inline-flex align-items-center gap-2">
                <input type="date" name="date" class="form-control form-control-sm" th:value="${selectedDate}">
                <button type="submit" class="btn btn-outline-primary btn-sm">Go</button>
            </form>
            <a th:href="@{/appointments/calendar(date=${nextDate})}" class="btn btn-outline-secondary btn-sm">Next &raquo;</a>
            <span class="ms-2 fw-bold" th:text="${#temporals.format(selectedDate, 'EEEE, dd-MMM-yyyy')}"></span>
            <a th:href="@{/appointments}" class="ms-auto btn btn-link btn-sm">View as List</a>
        </div>

        <div th:if="${#lists.isEmpty(barbers)}" class="alert alert-warning">
            No barbers found. Add a barber to see the calendar.
        </div>

        <div class="table-responsive" th:if="${!#lists.isEmpty(barbers)}">
            <table class="table table-bordered calendar-table align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th class="time-col">Time</th>
                        <th th:each="barber : ${barbers}" th:text="${barber.name}"></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="row, rowStat : ${grid}">
                        <td class="time-col" th:text="${#temporals.format(timeSlots[rowStat.index], 'HH:mm')}"></td>
                        <th:block th:each="cell : ${row}">
                            <td th:if="${cell.type.name() == 'EMPTY'}"></td>
                            <td th:if="${cell.type.name() == 'APPOINTMENT'}" th:rowspan="${cell.rowspan}">
                                <div class="appt-cell">
                                    <div class="fw-bold" th:text="${cell.appointment.customer.name}"></div>
                                    <div th:text="${cell.appointment.service.name}"></div>
                                    <span class="badge"
                                          th:classappend="${cell.appointment.status.name() == 'SCHEDULED'} ? 'bg-primary' : (${cell.appointment.status.name() == 'COMPLETED'} ? 'bg-success' : 'bg-secondary')"
                                          th:text="${cell.appointment.status}"></span>
                                </div>
                            </td>
                        </th:block>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
