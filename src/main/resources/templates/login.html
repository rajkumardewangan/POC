<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Salon Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-md-5">
                    <h2 class="mb-3">Salon Access</h2>
                    <p class="text-muted">Sign in with a mobile number registered by an admin.</p>

                    <div th:if="${message != null}" class="alert alert-success" th:text="${message}"></div>
                    <div th:if="${error != null}" class="alert alert-danger" th:text="${error}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="phone" class="form-label">Mobile Number</label>
                            <input id="phone" name="phone" type="text" class="form-control" placeholder="Enter mobile number" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100">Continue</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
